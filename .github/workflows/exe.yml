name: Build Windows exe
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build virtual camera helper
        run: |
          python -m pip install --upgrade pip
          pip install -r helper/requirements.txt
          pyinstaller --onefile --name vcam_helper --collect-all pyvirtualcam --distpath helper-dist --noconfirm helper/vcam_helper.py
          ./helper-dist/vcam_helper.exe --selftest
        shell: bash
      - name: Install Node packages
        run: npm install
      - name: Build installer
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: SnapCinemaFX-Setup
          path: dist/*.exe
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
